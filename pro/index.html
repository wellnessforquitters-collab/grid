:root{--bg:#fff;--fg:#000;--muted:#707070;--soft:#e6e6e6;--chip:#f3f3f3;--acc:#e8322e;--accsoft:#f8d3d1;
  --sans:Geist,-apple-system,"Helvetica Neue",Arial,sans-serif;--script:"Mrs Saint Delafield","Snell Roundhand",cursive;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 var(--sans);letter-spacing:-.005em;
  padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{height:34px;width:auto;display:block}
.hbtn{font:inherit;font-size:14px;background:none;border:1px solid var(--fg);width:30px;height:30px;border-radius:50%;cursor:pointer;color:var(--fg);flex:none}
h1{font-weight:500;font-size:clamp(28px,7vw,40px);line-height:1.05;margin:0;letter-spacing:-.03em;text-transform:lowercase;text-wrap:balance}
h1 em{font-style:normal;color:var(--acc)}
h2{font-weight:500;font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:0;color:var(--muted)}
.kick{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin:0 0 6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.stat{display:flex;gap:18px;flex-wrap:wrap;font-size:15px}
.stat b{font-weight:600;font-size:22px;margin-right:4px;letter-spacing:-.02em}
.stat .r b{color:var(--acc)}
button{font:inherit;color:inherit}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;font-size:16px;padding:13px 20px;border:1px solid var(--fg);background:var(--fg);color:#fff;cursor:pointer;text-decoration:none;border-radius:0;font-weight:500}
.btn.ghost{background:transparent;color:var(--fg)}
.btn.red{background:var(--acc);border-color:var(--acc)}
.btn:disabled{opacity:.3}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--acc);display:inline-block}

/* ===== the grid ===== */
.grid{display:grid;grid-template-columns:repeat(9,1fr);aspect-ratio:1/1;width:100%;border-top:2px solid var(--fg);border-left:2px solid var(--fg);user-select:none}
.cell{position:relative;border-right:1px solid var(--fg);border-bottom:1px solid var(--fg);display:flex;align-items:center;justify-content:center;
  text-align:center;overflow:hidden;font-size:clamp(6px,1.55vw,9.5px);line-height:1.1;padding:2px;word-break:break-word;hyphens:auto;text-transform:lowercase;cursor:pointer}
.cell.br{border-right-width:2px}.cell.bb{border-bottom-width:2px}
.cell span{position:relative;z-index:1}
.cell::before{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:var(--acc);opacity:.22;transition:height .55s cubic-bezier(.3,1.4,.5,1),opacity .4s}
.cell.s1::before{height:50%}
.cell.s2::before{height:100%;opacity:1}
.cell.s2{color:#fff}
.cell.hub{color:var(--acc);font-weight:500}
.cell.hub::before{height:var(--f,0%);opacity:.16}
.cell.goal{color:var(--acc);font-weight:600;font-size:clamp(7px,1.8vw,12px)}
.cell.goal::before{height:100%;opacity:var(--g,0);background:var(--acc)}
.cell.goal.lit{color:#fff}
.cell.focus::after{content:"✦";position:absolute;top:1px;right:2px;font-size:8px;color:var(--acc);z-index:2}
.cell.s2.focus::after{color:#fff}
.cell.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.12)}}
.blockhint{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);align-items:center}
.sq{width:13px;height:13px;border:1px solid var(--fg);display:inline-block;vertical-align:-2px;margin-right:5px;position:relative;overflow:hidden}
.sq.s1{background:linear-gradient(to top,var(--accsoft) 50%,#fff 50%)}
.sq.s2{background:var(--acc);border-color:var(--acc)}

/* ===== sections ===== */
.box{position:relative;border:1px solid var(--fg);padding:22px 18px 18px;display:flex;flex-direction:column;gap:12px}
.box .tag{position:absolute;top:-10px;left:16px;background:var(--bg);padding:0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.st{position:absolute;font-size:14px;line-height:1;background:var(--bg);padding:2px;color:var(--fg)}
.st.tl{top:-10px;left:-10px}.st.tr{top:-10px;right:-10px}.st.bl{bottom:-10px;left:-10px}.st.br{bottom:-10px;right:-10px}
.areas{display:flex;flex-direction:column}
.area{display:grid;grid-template-columns:minmax(0,1fr) auto 44px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--soft);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.area:first-child{border-top:1px solid var(--soft)}
.area .n{text-transform:lowercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.area .n i{font-style:normal;color:var(--acc);font-size:12px;margin-left:6px;letter-spacing:.04em}
.segs{display:flex;gap:2px}
.segs b{width:11px;height:14px;border:1px solid var(--fg);display:block}
.segs b.s1{background:linear-gradient(to top,var(--accsoft) 50%,#fff 50%)}
.segs b.s2{background:var(--acc);border-color:var(--acc)}
.area .p{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.ba{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.ba .arrow{color:var(--acc);font-size:18px}
.ba .grid{border-top-width:1px;border-left-width:1px;pointer-events:none}
.ba .cell{font-size:0;padding:0;cursor:default}
.ba .cell.br{border-right-width:1px}.ba .cell.bb{border-bottom-width:1px}
.ba .cap{font-size:13px;color:var(--muted);margin-top:6px;text-align:center}
.ba .cap b{color:var(--fg);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:14px;background:var(--chip);border:1px solid transparent;padding:6px 12px;border-radius:999px;cursor:pointer;text-transform:lowercase}
.chip.on{background:var(--fg);color:#fff}
.closing{font-family:var(--script);font-size:40px;line-height:1;margin:6px 0 0;text-align:center}
footer{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-size:14px}

/* ===== overlays ===== */
.ov{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;display:none;
  padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(30px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.ov.on{display:block}
.ov .wrap{gap:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top .back{background:none;border:0;font-size:15px;cursor:pointer;padding:6px 0}
.arrows{display:flex;gap:6px}
.arrows button{width:38px;height:38px;border:1px solid var(--fg);background:none;cursor:pointer;font-size:16px}
.zoomin{animation:zin .32s cubic-bezier(.2,.9,.3,1)}
@keyframes zin{from{transform:scale(.35);opacity:0}}
.big{display:grid;grid-template-columns:repeat(3,1fr);aspect-ratio:1/1;border-top:2px solid var(--fg);border-left:2px solid var(--fg);user-select:none}
.big .cell{font-size:clamp(13px,3.6vw,17px);padding:8px;line-height:1.15;border-right-width:2px;border-bottom-width:2px}
.big .cell.hub{font-size:clamp(15px,4.4vw,21px)}
.big .cell.hub small{display:block;font-size:12px;color:var(--muted);margin-top:4px;font-weight:400}
.big .cell .mk{position:absolute;bottom:6px;left:0;right:0;font-size:11px;letter-spacing:.06em;opacity:.75;z-index:1}
.editbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet{position:fixed;inset:auto 0 0 0;z-index:30;background:var(--bg);border-top:2px solid var(--fg);padding:20px 16px max(24px,env(safe-area-inset-bottom));display:none;flex-direction:column;gap:12px;max-width:600px;margin:0 auto}
.sheet.on{display:flex}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25;display:none}
.shade.on{display:block}
input.f,textarea.f{width:100%;font:inherit;font-size:17px;border:0;border-bottom:1px solid var(--fg);padding:10px 0;background:transparent;outline:none;border-radius:0}
input.f:focus,textarea.f:focus{border-bottom-color:var(--acc)}
textarea.f{resize:none;font-size:13px;font-family:ui-monospace,monospace}
.steps{display:flex;gap:6px}
.steps i{height:3px;flex:1;background:var(--soft)}
.steps i.on{background:var(--fg)}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--fg);color:#fff;padding:10px 16px;font-size:14px;opacity:0;transition:.25s;z-index:40;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.wall img{width:100%;max-width:260px;display:block;margin:0 auto;border:1px solid var(--fg)}

/* ===== this month tracker ===== */
.tk-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-top:2px solid var(--fg);border-left:2px solid var(--fg)}
.tk{border-collapse:collapse;user-select:none}
.tk td,.tk th{border-right:1px solid var(--fg);border-bottom:1px solid var(--fg);padding:0;text-align:center;font-weight:400}
.tk th{font-size:11px;color:var(--muted);height:30px;min-width:30px}
.tk th.today{color:var(--acc);font-weight:600}
.tk .nm{position:sticky;left:0;background:var(--bg);text-align:left;min-width:128px;max-width:128px;padding:6px 8px;font-size:13px;line-height:1.15;border-right-width:2px;cursor:pointer;z-index:1;text-transform:lowercase}
.tk .nm small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.tk .nm small.go{color:var(--acc)}
.tk th.nm{z-index:2}
.tk td.d{width:30px;height:38px;cursor:pointer;position:relative}
.tk td.d.future{background:repeating-linear-gradient(45deg,#fff 0 4px,#f6f6f6 4px 8px);cursor:default}
.tk td.d.today{box-shadow:inset 0 0 0 2px var(--acc)}
.tk td.d::before{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border:1.5px solid #c9c9c9;border-radius:3px;transition:border-color .2s}
.tk td.d.on::before{border-color:var(--acc)}
.tk td.d.future::before{display:none}
.tk td.d svg{position:relative;width:20px;height:20px;display:block;margin:auto;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.tk td.d.on svg{transform:scale(1)}
.tk td.d.on{background:#fff}
.tk tr.add td{height:44px;color:var(--muted);font-size:14px;cursor:pointer;text-align:left;padding-left:8px}
.bars{display:flex;gap:10px;align-items:flex-end;height:120px;border-bottom:2px solid var(--fg);padding:0 4px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.bar i{display:block;width:100%;background:var(--acc);height:0;transition:height .6s cubic-bezier(.3,1.2,.5,1)}
.bar i.cur{background:repeating-linear-gradient(45deg,var(--acc) 0 6px,#f08b88 6px 12px)}
.bar span{font-size:12px;color:var(--muted)}
.barlab{display:flex;gap:10px;padding:6px 4px 0}
.barlab span{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.mprog{display:flex;flex-direction:column;gap:8px}
.mprog .mbig{font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1}
.mprog .mbig span{font-size:15px;font-weight:400;color:var(--muted);letter-spacing:0;margin-left:8px}
.mbar{height:10px;border:1.5px solid var(--fg)}
.mbar i{display:block;height:100%;width:0;background:var(--acc);transition:width .7s cubic-bezier(.3,1.1,.5,1)}
.sugg{display:flex;flex-wrap:wrap;gap:6px;max-height:190px;overflow:auto}

/* ===== how-it-works demo (no words needed) ===== */
.demo{display:grid;grid-template-columns:repeat(3,1fr);width:210px;aspect-ratio:1;margin:8px auto 0;border-top:2px solid var(--fg);border-left:2px solid var(--fg);position:relative}
.demo .cell{font-size:11px;cursor:default;border-right-width:2px;border-bottom-width:2px}
.demo .cell.a::before{animation:fa 4.8s infinite}
.demo .cell.b::before{animation:fb 4.8s infinite}
.demo .cell.a{animation:ta 4.8s infinite}
.demo .hub::before{animation:fh 4.8s infinite}
@keyframes fa{0%,18%{height:0;opacity:.22}24%,44%{height:50%;opacity:.22}50%,92%{height:100%;opacity:1}100%{height:0;opacity:.22}}
@keyframes ta{0%,49%{color:var(--fg)}50%,92%{color:#fff}100%{color:var(--fg)}}
@keyframes fb{0%,66%{height:0}72%,92%{height:50%}100%{height:0}}
@keyframes fh{0%,20%{height:0}26%{height:6%}52%{height:12%}74%,92%{height:19%}100%{height:0}}
.finger{position:absolute;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.18);border:2px solid var(--fg);z-index:3;animation:fg 4.8s infinite;left:0;top:0}
@keyframes fg{0%{transform:translate(150px,150px);opacity:0}10%{opacity:1;transform:translate(22px,22px)}20%{transform:translate(22px,22px) scale(.75)}24%{transform:translate(22px,22px) scale(1)}44%{transform:translate(22px,22px) scale(.75)}50%{transform:translate(22px,22px) scale(1)}62%{transform:translate(160px,22px)}66%{transform:translate(160px,22px) scale(.75)}72%{transform:translate(160px,22px) scale(1);opacity:1}90%{opacity:0}100%{opacity:0}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;font-size:14px}
.keys .sq{width:30px;height:30px;display:block;margin:0 auto 6px}
/* ===== app: grid + two pages you swipe to ===== */
.appbar{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:34px}
.nav{display:flex;align-items:center;gap:10px}
.nav .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.dots{display:flex;gap:6px}
.dots i{width:6px;height:6px;border-radius:50%;border:1px solid var(--fg);display:block;transition:background .2s}
.dots i.on{background:var(--fg)}
.nav button{width:34px;height:34px;border:1px solid var(--fg);background:none;cursor:pointer;font-size:15px;padding:0;color:var(--fg)}
.nav button:disabled{opacity:.2;cursor:default}
.pages{overflow:hidden;margin:0 calc(-1 * max(16px,env(safe-area-inset-right)));transition:height .35s cubic-bezier(.3,.9,.3,1)}
.ptrack{display:flex;align-items:flex-start;transition:transform .45s cubic-bezier(.3,.9,.3,1);touch-action:pan-y}
.pg{flex:0 0 100%;min-width:0;padding:0 max(16px,env(safe-area-inset-right));display:flex;flex-direction:column;gap:30px}
.ph{display:flex;flex-direction:column;gap:6px}
.sec{display:flex;flex-direction:column}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--fg)}
.sec-h b{font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.sec-h span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ln{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;align-items:center;min-height:50px;border-bottom:1px solid var(--soft)}
.ln>span{font-size:13px;color:var(--muted)}
.in{width:100%;min-width:0;font:inherit;font-size:16px;border:0;padding:14px 0;background:transparent;outline:none;color:var(--fg);border-radius:0}
.in::placeholder,.qa::placeholder{color:#bdbdbd}
input[type=date].in{-webkit-appearance:none;appearance:none;min-height:50px;text-align:left}
/* purpose: four squares */
.quad{display:grid;grid-template-columns:1fr 1fr;margin-top:14px}
.qh{display:grid;grid-template-columns:1fr 1fr;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 0 8px}
.qh span{padding-left:12px}
.quad label{border:1px solid var(--fg);margin:0 -1px -1px 0;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0;aspect-ratio:1/0.82}
.quad label .who{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.quad.qq label{aspect-ratio:auto;min-height:96px}
.qa{flex:1;width:100%;font:inherit;font-size:15px;line-height:1.35;border:0;padding:0;background:transparent;outline:none;resize:none;color:var(--fg)}
/* rows with a box or circle */
.row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:center;min-height:50px;border-bottom:1px solid var(--soft);cursor:pointer}
.row .t{min-width:0;overflow-wrap:anywhere}
.row .m{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .m.late{color:var(--acc)}
.bx{width:18px;height:18px;border:1.5px solid var(--fg);display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s}
.done .bx{background:var(--acc);border-color:var(--acc)}
.done .bx::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.row.done .t{color:var(--muted);text-decoration:line-through}
.addln{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:center;border-bottom:1px solid var(--soft)}
.addln .plus{color:var(--muted);font-size:18px;text-align:center}
.addln input[type=date]{font:inherit;font-size:13px;color:var(--muted);border:0;background:transparent;width:112px}
/* habits */
.hab{display:grid;grid-template-columns:minmax(0,1fr) auto 30px;gap:14px;align-items:center;min-height:54px;border-bottom:1px solid var(--soft)}
.hab .t{min-width:0;overflow-wrap:anywhere;cursor:pointer}
.wk{display:flex;gap:4px}
.wk i{width:8px;height:8px;border:1px solid var(--fg);display:block}
.wk i.on{background:var(--acc);border-color:var(--acc)}
.wk i.td{outline:1px solid var(--acc);outline-offset:1px}
.ci{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--fg);background:none;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s,transform .2s}
.ci.on{background:var(--acc);border-color:var(--acc)}
.ci.on::after{content:"";width:10px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.ci.pop{animation:pop .4s}
.kind{display:grid;grid-template-columns:minmax(0,1fr) 30px;gap:14px;align-items:center;border-bottom:1px solid var(--soft)}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0;line-height:1.45}
.stuckln{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.stuckln b{color:var(--acc);font-weight:500}
.gtools{display:flex;gap:8px}.gt{flex:1;border:1px solid var(--fg);background:none;color:var(--fg);font:inherit;font-size:14px;padding:10px;cursor:pointer}.gt.on{background:var(--acc);border-color:var(--acc);color:#fff}
.foot{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-size:14px;padding-top:6px}

/* ===== card of the day ===== */
.dcard{perspective:1200px;cursor:pointer;height:150px}
.dc-in{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.3,.9,.3,1);transform-style:preserve-3d}
.dcard.flip .dc-in{transform:rotateY(180deg)}
.dc-back,.dc-front{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--fg);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;padding:18px 22px;text-align:center;background:var(--bg)}
.dc-back{background:repeating-linear-gradient(45deg,var(--bg) 0 9px,#f6f6f6 9px 10px)}
.dc-back .dc-t{font-size:20px;font-weight:500;letter-spacing:-.02em}
.dc-front{transform:rotateY(180deg)}
.dc-k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.dc-m{margin:0;font-size:19px;line-height:1.3;letter-spacing:-.015em;text-wrap:balance}
.dc-s{font-size:12px;color:var(--muted)}
.dcard .st{position:absolute;font-size:13px;line-height:1;background:var(--bg);padding:2px;color:var(--fg)}
.dcard .st.tl{top:-9px;left:-9px}.dcard .st.tr{top:-9px;right:-9px}.dcard .st.bl{bottom:-9px;left:-9px}.dcard .st.br{bottom:-9px;right:-9px}
/* ===== progress ===== */
.pline{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);padding:12px 0 6px}
.pline b{font-weight:500;color:var(--fg)}.pline b.r{color:var(--acc)}
.pbars{display:flex;flex-direction:column}
.pbar{display:grid;grid-template-columns:96px minmax(0,1fr) 40px;gap:12px;align-items:center;height:38px;border:0;border-bottom:1px solid var(--soft);background:none;padding:0;text-align:left;cursor:pointer;width:100%}
.pbar .n{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar .t{height:4px;background:var(--soft);position:relative}
.pbar .t i{position:absolute;left:0;top:0;bottom:0;background:var(--acc)}
.pbar .p{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
/* ===== today: soft cards ===== */
.tcs{display:flex;flex-direction:column;gap:10px}
.tc{background:#f5f5f4;border-radius:16px;padding:16px 16px 14px;display:flex;flex-direction:column}
.tk{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.tk b{font-weight:500;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--acc)}
.tk span{font-size:12px;color:var(--muted)}
.tc .ed{font:inherit;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.tc .fbig{margin:2px 0 0;font-size:34px;font-weight:500;letter-spacing:-.035em;line-height:1.1}
.tc .ask{font:inherit;font-size:17px;color:#a3a3a3;background:none;border:0;padding:8px 0 4px;text-align:left;cursor:pointer}
.tc .ask u{color:var(--fg);text-underline-offset:3px}
.tc .tr{display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:12px;align-items:center;min-height:48px;border-top:1px solid #e3e3e1}
.tc .tk+.tr{border-top:0}
.tc .tr .tt{font-size:17px;letter-spacing:-.01em;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.tc .tr.dn .tt{color:var(--muted)}
.tc .tr .in{padding:12px 0;font-size:17px}
.tc .ci{width:28px;height:28px}
.tc .in{font-size:17px;padding:8px 0 4px}
.tc .in.own{border-bottom:1px solid #d8d8d6;margin-top:6px;font-size:15px}
.tc .opts{display:flex;flex-wrap:wrap;gap:6px;padding-top:10px}

<script>//---------------------------------------------------------------------
//

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';

const AROUND=[0,1,2,3,5,6,7,8];
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||"null")||d}catch(e){return d}};
let G=load("goalgrid",null);
let P=Object.assign({unlocked:false,key:"",st:{},focus:null,snaps:[],checkins:[],onboarded:false,installDone:false,visits:0,trk:{},why:{},goalDate:"",goalSign:"",tasks:[],diary:{},kind:{},page:0,welcomed:false},load("gridpro2",{}));
["trk","why","diary","kind"].forEach(k=>{if(!P[k])P[k]={}});if(!P.tasks)P.tasks=[];if(!P.quit)P.quit=[];
const IOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
/* the grid travels inside the link: #g= from the free grid, #p= personal link with everything */
const pack=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unpack=t=>JSON.parse(decodeURIComponent(escape(atob(t.replace(/-/g,"+").replace(/_/g,"/")))));
const linkData=(lite)=>{const o={};for(const k in P)if(!["page","visits","installDone","checkins","trk","diary","kind","habits","ticks"].includes(k))o[k]=P[k];
  if(lite){delete o.days;delete o.cards;if(o.snaps&&o.snaps.length>1)o.snaps=[o.snaps[0]]}return{G,P:o}};
const myLink=(lite)=>location.origin+location.pathname+"#p="+pack(linkData(lite));
function applyLink(d){if(d&&d.G&&(!P.updated||(d.P.updated||0)>P.updated||!hasGrid())){G=d.G;Object.assign(P,d.P);saveG();try{localStorage.setItem("gridpro2",JSON.stringify(P))}catch(e){}}}
/* shorter link (squeezed), so it fits in a qr code */
const b64u=u=>{let t="";u.forEach(c=>t+=String.fromCharCode(c));return btoa(t).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
async function zLink(lite){const base=location.origin+location.pathname;
  try{const st=new Blob([JSON.stringify(linkData(lite))]).stream().pipeThrough(new CompressionStream("deflate-raw"));
    return base+"#z="+b64u(new Uint8Array(await new Response(st).arrayBuffer()))}catch(e){return myLink(lite)}}
async function fromZ(){const h=location.hash;if(!h.startsWith("#z="))return;
  try{const t=h.slice(3).replace(/-/g,"+").replace(/_/g,"/"),bin=atob(t),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    const st=new Blob([u]).stream().pipeThrough(new DecompressionStream("deflate-raw"));applyLink(JSON.parse(await new Response(st).text()))}catch(e){}
  try{history.replaceState(null,"",location.pathname)}catch(e){}}
const saveP=(touch=true)=>{if(touch)P.updated=Date.now();try{localStorage.setItem("gridpro2",JSON.stringify(P))}catch(e){}
  if(IOS&&P.unlocked&&hasGrid()){try{history.replaceState(null,"",myLink())}catch(e){}}};   // iphone home-screen icon keeps this link
const saveG=()=>{try{localStorage.setItem("goalgrid",JSON.stringify(G))}catch(e){}};
(function fromLink(){const h=location.hash;
  try{
    if(h.startsWith("#g=")){const g=unpack(h.slice(3));if(g&&g.goal){G=g;saveG()}}
    if(h.startsWith("#p="))applyLink(unpack(h.slice(3)));
  }catch(e){}
  if(h.startsWith("#g="))history.replaceState(null,"",location.pathname);
})();

function cellInfo(b,c){
  if(b===4) return c===4?{t:G.goal,k:"goal"}:{t:G.pillars[AROUND.indexOf(c)],k:"hub",p:AROUND.indexOf(c)};
  const p=AROUND.indexOf(b); if(c===4) return {t:G.pillars[p],k:"hub",p};
  const i=AROUND.indexOf(c); return {t:G.actions[p][i],k:"act",p,id:p+"-"+i};
}
function gridHTML(st,mini){
  const tot=totals(st), g=Math.min(1,tot.score/128);
  let h='<div class="grid">';
  for(let r=0;r<9;r++)for(let col=0;col<9;col++){
    const b=Math.floor(r/3)*3+Math.floor(col/3),c=(r%3)*3+col%3,x=cellInfo(b,c);
    let cls="cell",sty="";
    if(col%3===2)cls+=" br"; if(r%3===2)cls+=" bb";
    if(x.k==="act"){const v=S(st,x.id);if(v)cls+=" s"+v;if(!mini&&P.focus===x.id)cls+=" focus"}
    if(x.k==="hub"){cls+=" hub";sty=`--f:${Math.round(areaSum(st,x.p)/16*100)}%`}
    if(x.k==="goal"){cls+=" goal"+(g>.45?" lit":"");sty=`--g:${(.08+g*.92).toFixed(2)}`}
    h+=`<div class="${cls}" style="${sty}" data-b="${b}" data-c="${c}"><span>${mini?"":esc(x.t)}</span></div>`;
  }
  return h+"</div>";
}

/* checks the key with polar. returns true, or an error message */
async function activate(k){
  try{let r;for(const org of POLAR_IDS){r=await fetch("https://api.polar.sh/v1/customer-portal/license-keys/activate",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify({key:k,organization_id:org,label:devLabel()})});if(r.ok||r.status===403)break}
    if(r.status===403)return "this key is already used on 3 devices";
    if(!r.ok)return "this key doesn't work";
    const j=await r.json(),bid=j.license_key&&j.license_key.benefit_id,st=j.license_key&&j.license_key.status;
    if(st&&st!=="granted")return "this key doesn't work";
    if(POLAR_BENEFIT_IDS.length&&!POLAR_BENEFIT_IDS.includes(bid))return "this key is for a different product";
    P.activation=j.id;P.unlocked=true;P.key=k;saveP();keyScreen=false;

}

function bindPages(){const tr=$("#ptr"),v=$("#pages");
  const fit=()=>{const pg=tr.children[P.page||0];if(pg)v.style.height=pg.offsetHeight+"px"};
  const go=(i,anim=true)=>{i=Math.max(0,Math.min(2,i));const moved=i!==(P.page||0);P.page=i;saveP(false);
    tr.style.transition=anim?"":"none";v.style.transition=anim?"":"none";tr.style.transform=`translateX(${-100*i}%)`;fit();
    document.querySelectorAll(".dots i").forEach((d,k)=>d.classList.toggle("on",k===i));
    $("#pp").disabled=i===0;$("#pn").disabled=i===2;if(moved&&anim)scrollTo({top:0,behavior:"smooth"})};
  go(P.page||0,false);window._fit=fit;
  $("#pp").onclick=()=>go(P.page-1);$("#pn").onclick=()=>go(P.page+1);
  let x0=null,y0=null;
  tr.addEventListener("touchstart",e=>{if(e.target.closest("input,textarea"))return;x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  tr.addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.4)go(P.page+(dx<0?1:-1))},{passive:true});
}

/* ===== zoom into one area ===== */
let zp=0, editing=false, zoomReturn=null;
function openZoom(p,fromEl){zp=p;editing=false;$("#zoom").classList.add("on");document.body.style.overflow="hidden";renderZoom(true,fromEl)}
function closeZoom(){$("#zoom").classList.remove("on");document.body.style.overflow="";keep()}
function renderZoom(anim,fromEl){
  const name=G.pillars[zp], pct=Math.round(areaSum(P.st,zp)/16*100);
  let h=`<div class="top"><button class="back" id="zb">← whole grid</button><div class="arrows"><button id="zprev" aria-label="previous area">←</button><button id="znext" aria-label="next area">→</button></div></div>
  <div class="big ${anim?"zoomin":""}" id="big">`;
  for(let c=0;c<9;c++){
    const r=Math.floor(c/3),col=c%3;let cls="cell";if(col===2)cls+=" br";if(r===2)cls+=" bb";
    if(c===4){h+=`<div class="${cls} hub" style="--f:${pct}%"><span>${esc(name)}<small>${pct}%</small></span></div>`;continue}
    const i=AROUND.indexOf(c),id=zp+"-"+i,v=S(P.st,id);
    h+=`<div class="${cls}${v?" s"+v:""}${P.focus===id?" focus":""}" data-id="${id}"><span>${esc(G.actions[zp][i])}</span><span class="mk">${v?WORD[v]:""}</span></div>`;
  }
  h+=`</div>
  <div class="editbar"><div class="legend"><span><i class="sq"></i>not yet</span><span><i class="sq s1"></i>trying</span><span><i class="sq s2"></i>part of me</span></div>
  <button class="link" id="ed">${editing?"done":"rename"}</button></div>
  ${editing?'<p class="small" style="margin:0;color:var(--acc)">tap a cell to rename it</p>':""}`;
  $("#zoomIn").innerHTML=h;
  if(anim&&fromEl){const r=fromEl.getBoundingClientRect(),big=$("#big").getBoundingClientRect();
    $("#big").style.transformOrigin=`${r.left+r.width/2-big.left}px ${r.top+r.height/2-big.top}px`}
  $("#zb").onclick=closeZoom;
  $("#zprev").onclick=()=>{zp=(zp+7)%8;renderZoom(true)};
  $("#znext").onclick=()=>{zp=(zp+1)%8;renderZoom(true)};
  $("#ed").onclick=()=>{editing=!editing;renderZoom()};
  document.querySelectorAll("#big [data-id]").forEach(el=>el.onclick=()=>{
    const id=el.dataset.id;
    if(editing)return renameCell(id);
    const v=(S(P.st,id)+1)%3; if(v)P.st[id]=v; else delete P.st[id];
    snapshot();saveP();hapt();
    el.classList.remove("s1","s2");if(v)el.classList.add("s"+v);
    el.querySelector(".mk").textContent=v?WORD[v]:"";
    el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop");
    const pct=Math.round(areaSum(P.st,zp)/16*100),hub=document.querySelector("#big .hub");hub.style.setProperty("--f",pct+"%");hub.querySelector("small").textContent=pct+"%";
    if(v===2&&areaSum(P.st,zp)===16)toast("all of "+G.pillars[zp]+" is part of you ✦");
  });
}

  if(x)x.onclick=()=>{P.installDone=true;saveP();render()}}

/* ===== lock screen wallpaper ===== */
function wrapText(x,t,maxW,maxLines){const words=String(t).split(/\s+/);const lines=[];let cur="";
  for(const w of words){const test=cur?cur+" "+w:w;if(x.measureText(test).width<=maxW||!cur)cur=test;else{lines.push(cur);cur=w}}
  if(cur)lines.push(cur);return lines.slice(0,maxLines)}
async function openWallpaper(){
  try{await document.fonts.load('500 40px Geist');await document.fonts.load('400 40px Geist')}catch(e){}
  const W=1170,H=2532,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,W,H);
  const t=totals(P.st),size=1010,X=(W-size)/2,Y=1000,cs=size/9;
  x.textAlign="center";x.fillStyle="#e8322e";x.font="500 34px Geist, sans-serif";x.fillText("✦  "+G.goal.toLowerCase()+"  ✦",W/2,Y-56);
  for(let r=0;r<9;r++)for(let col=0;col<9;col++){
    const b=Math.floor(r/3)*3+Math.floor(col/3),cc=(r%3)*3+col%3,info=cellInfo(b,cc),cx=X+col*cs,cy=Y+r*cs;
    let fill=0,txt="#000";
    if(info.k==="act"){const v=S(P.st,info.id);if(v===1){x.fillStyle="#f8d3d1";x.fillRect(cx,cy+cs/2,cs,cs/2)}if(v===2){x.fillStyle="#e8322e";x.fillRect(cx,cy,cs,cs);txt="#fff"}}
    if(info.k==="hub"){const f=areaSum(P.st,info.p)/16;x.fillStyle="rgba(232,50,46,.16)";x.fillRect(cx,cy+cs*(1-f),cs,cs*f);txt="#e8322e"}
    if(info.k==="goal"){const g=Math.min(1,t.score/128);x.fillStyle=`rgba(232,50,46,${.08+g*.92})`;x.fillRect(cx,cy,cs,cs);txt=g>.45?"#fff":"#e8322e"}
    x.fillStyle=txt;x.font=(info.k==="act"?"400 ":"500 ")+"19px Geist, sans-serif";
    const lines=wrapText(x,String(info.t||"").toLowerCase(),cs-14,4),lh=22,sy=cy+cs/2-(lines.length-1)*lh/2+7;
    lines.forEach((l,i)=>x.fillText(l,cx+cs/2,sy+i*lh));
  }
  x.strokeStyle="#000";
  for(let i=0;i<=9;i++){x.lineWidth=i%3===0?4:1.5;x.beginPath();x.moveTo(X+i*cs,Y);x.lineTo(X+i*cs,Y+size);x.stroke();x.beginPath();x.moveTo(X,Y+i*cs);x.lineTo(X+size,Y+i*cs);x.stroke()}
  x.fillStyle="#000";x.font="400 30px Geist, sans-serif";x.fillText(`${t.part} part of me  ·  ${t.trying} trying`,W/2,Y+size+80);
  x.fillStyle="#707070";x.font="400 24px Geist, sans-serif";x.fillText("@thewellnessforquitters",W/2,H-150);
  c.toBlob(blob=>{const url=URL.createObjectURL(blob),file=new File([blob],"my-grid.png",{type:"image/png"});
    const canShare=navigator.canShare&&navigator.canShare({files:[file]});
    openSheet(`<div class="wall"><img src="${url}" alt="your grid wallpaper"></div>
      <p class="small muted" style="margin:0;text-align:center">${canShare?"save the image, then set it as your lock screen.":"press and hold the image to save it, then set it as your lock screen."}</p>
      <div class="row2"><button class="btn ghost" id="wx">close</button>${canShare?'<button class="btn" id="ws">save</button>':`<a class="btn" href="${url}" download="my-grid.png">download</a>`}</div>`);
    $("#wx").onclick=closeSheet;const s=$("#ws");if(s)s.onclick=()=>navigator.share({files:[file]}).catch(()=>{});
  },"image/png");
}

/* ===== start ===== */
(async()=>{await fromZ();
P.visits=(P.visits||0)+1;
if(P.unlocked&&hasGrid()){if(!P.snaps.length)snapshot();monthSnap()}
saveP(false);render()})();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
