<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>what's your habit type? · the wellness for quitters club</title>
<meta name="description" content="12 cards, 1 minute. find out why you quit habits and the system that works for your type.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111; --soft:#8c8c8c; --line:#e7e7e7; --red:#d23a2f; --chip:#f2f2f2;
    --U:#f6f2a8; --O:#f1d7fb; --R:#c9f2f0; --Q:#dde3ea;
    --font:"Geist",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:#fff;overscroll-behavior:none}
  body{font-family:var(--font);color:var(--ink);text-transform:lowercase;-webkit-font-smoothing:antialiased}
  main{max-width:520px;margin:0 auto;padding:20px 16px 36px;min-height:100svh;display:flex;flex-direction:column}
  .top{display:flex;justify-content:space-between;align-items:flex-end}
  .logo{height:40px;width:auto;display:block}
  .handle{font-size:13px;color:var(--soft);padding-bottom:6px}
  @media (max-width:430px){ .handle{display:none} .logo{height:34px} }
  .rule{height:3px;background:var(--ink);margin-top:12px}
  .screen{flex:1;display:flex;flex-direction:column;padding-top:24px}
  .anim{animation:in .35s ease both}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:52px;line-height:.95;font-weight:500;letter-spacing:-.05em;margin-bottom:14px}
  h2{font-size:34px;line-height:1;font-weight:500;letter-spacing:-.04em}
  .red{color:var(--red)}
  .sub{font-size:16px;color:#555;line-height:1.45}
  .small{font-size:13px;color:var(--soft);line-height:1.4}
  .btn{display:block;width:100%;margin-top:20px;padding:16px;font:inherit;font-size:17px;background:var(--ink);color:#fff;border:1px solid var(--ink);cursor:pointer;text-transform:lowercase;text-align:center;text-decoration:none}
  .btn.ghost{background:#fff;color:var(--ink)}
  .btn:disabled{opacity:.3}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .row2 .btn{margin-top:0}

  /* intro */
  .fan{position:relative;height:210px;margin:6px 0 22px}
  .fan i{position:absolute;left:50%;top:10px;width:150px;height:190px;margin-left:-75px;border:1px solid rgba(0,0,0,.08);box-shadow:0 4px 14px rgba(0,0,0,.08)}
  .how{display:flex;gap:10px;margin-top:22px}
  .how div{flex:1;border-top:2px solid var(--ink);padding-top:8px;font-size:14px;line-height:1.3}
  .how b{display:block;font-size:22px;font-weight:500}

  /* deck */
  .dots{display:flex;gap:5px;justify-content:center;margin-bottom:14px}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .2s}
  .dots i.d{background:var(--ink)}
  .hintup,.hintdown{text-align:center;font-size:13px;color:var(--soft);height:20px}
  .deck{position:relative;flex:1;min-height:360px;max-height:470px;margin:6px 0;touch-action:none;user-select:none;-webkit-user-select:none}
  .card{position:absolute;inset:0;background:#fffdf6;border:1px solid rgba(0,0,0,.08);box-shadow:0 8px 24px rgba(0,0,0,.08);display:flex;flex-direction:column;justify-content:center;padding:30px 26px;touch-action:none;will-change:transform;cursor:grab}
  .card.dragging{box-shadow:0 4px 12px rgba(0,0,0,.08)}
  .card .shade{position:absolute;inset:0;pointer-events:none;opacity:0;background:#e9e7e2}
  .card{backface-visibility:hidden;transform:translateZ(0)}
  .card.back{transform:scale(.95) translateY(14px);box-shadow:0 4px 12px rgba(0,0,0,.05)}
  .card.back2{transform:scale(.9) translateY(28px);opacity:.6}
  .card .q{position:relative;z-index:1;font-size:28px;-webkit-font-smoothing:antialiased;backface-visibility:hidden;line-height:1.12;font-weight:500;letter-spacing:-.03em}
  .card .n{position:absolute;left:26px;top:22px;font-size:13px;color:var(--soft)}
  .card .tint{position:absolute;inset:0;pointer-events:none;opacity:0}
  .card .lab{position:absolute;left:0;right:0;text-align:center;font-size:15px;font-weight:500;opacity:0;pointer-events:none}
  .card .lab.me{top:20px} .card .lab.no{bottom:20px;color:var(--soft)}
  .ctrl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .ctrl button{font:inherit;font-size:16px;padding:15px 8px;border:1px solid var(--ink);background:#fff;cursor:pointer;text-transform:lowercase;color:var(--ink)}
  .ctrl button.me{background:var(--ink);color:#fff}

  /* stacks */
  .stacks{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end;height:220px;margin:18px 0 8px;border-bottom:1px solid var(--ink)}
  .stk{display:flex;flex-direction:column-reverse;align-items:center;gap:4px;height:100%}
  .stk i{width:100%;height:46px;border:1px solid rgba(0,0,0,.08);transform:translateY(-240px);opacity:0;transition:transform .5s cubic-bezier(.2,.9,.3,1.2),opacity .3s}
  .stk i.in{transform:none;opacity:1}
  .stl{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;font-size:12px;color:var(--soft);text-align:center}
  .stl b{display:block;color:var(--ink);font-weight:500;font-size:13px}

  /* result */
  .res{margin-top:6px;padding:26px 20px 22px;position:relative}
  .res .tag{font-size:13px;color:#555}
  .res h2{font-size:54px;margin:4px 0 12px;letter-spacing:-.05em}
  .res .quote{font-size:19px;line-height:1.3}
  .meth{margin-top:22px;border:1px solid var(--ink);background:#fff;padding:18px 16px}
  .meth .mt{font-size:13px;color:var(--red);letter-spacing:.04em}
  .meth h3{font-size:24px;font-weight:500;letter-spacing:-.03em;margin:4px 0 12px}
  .meth ul{list-style:none;border-top:1px solid var(--line)}
  .meth li{padding:10px 0 10px 20px;border-bottom:1px solid var(--line);font-size:16px;line-height:1.35;position:relative}
  .meth li::before{content:"✦";position:absolute;left:0;top:11px;color:var(--red);font-size:12px}
  .why{margin-top:14px;font-size:15px;line-height:1.45;color:#444}
  .sys{margin-top:40px}
  .sys .mt{font-size:13px;color:var(--red);letter-spacing:.04em}
  .sys h3{font-size:28px;font-weight:500;letter-spacing:-.03em;margin:6px 0 14px}
  .sys ul{list-style:none;border-top:1px solid var(--ink)}
  .sys li{padding:13px 0 13px 22px;border-bottom:1px solid var(--line);font-size:17px;line-height:1.35;position:relative}
  .sys li::before{content:"✦";position:absolute;left:0;top:14px;color:var(--red);font-size:12px}
  .sys .why{margin:0 0 16px;color:#555}
  .sys details{margin-top:14px}
  .sys summary{cursor:pointer;font-size:15px;color:var(--soft);list-style:none}
  .sys summary::before{content:"+ ";color:var(--red)}
  .sys details[open] summary::before{content:"– "}
  .sys details .why{margin-top:8px}
  .lnk{background:none;border:0;font:inherit;font-size:15px;color:var(--soft);text-decoration:underline;cursor:pointer;text-transform:lowercase}
  .soon{position:relative;border:1px solid var(--ink);padding:32px 18px 22px;margin-top:56px}
  .soon .tag2{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#fff;padding:0 10px;font-size:13px;letter-spacing:.08em;color:var(--red);white-space:nowrap}
  .soon .st{position:absolute;font-size:14px;line-height:1;background:#fff;padding:2px}
  .soon .st.tl{top:-9px;left:-9px}.soon .st.tr{top:-9px;right:-9px}.soon .st.bl{bottom:-9px;left:-9px}.soon .st.br{bottom:-9px;right:-9px}
  .soon h3{font-size:26px;font-weight:500;letter-spacing:-.03em;margin-bottom:4px}
  .soon ul{list-style:none;margin:14px 0;border-top:1px solid var(--line)}
  .soon li{padding:10px 0 10px 20px;border-bottom:1px solid var(--line);font-size:15px;position:relative;line-height:1.35}
  .soon li::before{content:"✦";position:absolute;left:0;top:11px;color:var(--red);font-size:12px}
  .soon .blur{filter:blur(4px);user-select:none;color:#777}
  .soon input{flex:1;font:inherit;font-size:17px;border:0;border-bottom:1px solid var(--ink);padding:11px 0;outline:none;background:transparent;border-radius:0}
  .soon .ok{font-size:15px;color:var(--red);margin-top:8px}
  .soon .early{font-size:13px;color:var(--soft);margin-top:10px}
  .links{margin-top:48px;font-size:15px}
  .links a{color:var(--ink)}
  .links.others{margin-top:16px;color:var(--soft);font-size:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .links.others button{font:inherit;font-size:14px;background:none;border:0;cursor:pointer;text-transform:lowercase;color:var(--ink);text-decoration:underline;padding:0 4px}
  .links.others button span{display:inline-block;width:9px;height:9px;margin-right:5px}
  .next{border:1px solid var(--ink);padding:16px;margin-top:22px}
  .next p{font-size:15px;line-height:1.4}
  .next .btn{margin-top:12px;padding:12px;font-size:15px}
  .mail{margin-top:22px}
  .mail p{font-size:15px;line-height:1.4;margin-bottom:6px}
  .mail input{width:100%;font:inherit;font-size:17px;border:0;border-bottom:1px solid var(--ink);padding:11px 0;outline:none;background:transparent;border-radius:0}
  .mail .ok{font-size:15px;color:var(--red);margin-top:8px}
  .credit{margin-top:40px;font-size:12px;color:var(--soft);line-height:1.5}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:11px 16px;font-size:15px;transition:all .3s;z-index:60;pointer-events:none;text-transform:lowercase}
  .toast.on{opacity:1;transform:translateX(-50%)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  .msheet{background:#fff;width:100%;max-width:380px;max-height:92vh;overflow:auto;padding:16px}
  .msheet img{display:block;width:100%;max-width:230px;margin:0 auto;border:1px solid var(--line)}
  .msheet .x{display:block;margin:10px auto 0;background:none;border:0;font:inherit;color:var(--soft);cursor:pointer;text-transform:lowercase}
  .hint2{font-size:13px;color:var(--soft);text-align:center;margin-top:10px;line-height:1.4}
  .hap{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;overflow:hidden}
  .foot{margin-top:28px;font-size:12px;color:var(--soft);display:flex;justify-content:space-between}
  .foot a{color:var(--soft)}
</style>
</head>

<script>
const SITE='gridyourgoal.com/type';
const T={
  U:{n:'upholder',c:'var(--U)',hex:'#f6f2a8',quote:'"i keep every promise, even to myself."',
     m:'the tick-tick method',steps:['same short routine every day','tick every step off','the satisfaction of a full checklist keeps you going'],
     why:'you meet expectations from others and from yourself. rules calm you down, so your system is a clear routine you can tick off. your only trap: when the plan breaks, you feel like you failed.'},
  Q:{n:'questioner',c:'var(--Q)',hex:'#dde3ea',quote:'"i\'ll start once i find the best method."',
     m:'the lab method',steps:['3 columns: tried / worked / didn\'t','test one version a week','your results > any video'],
     why:'you only do things that make sense to you. that\'s a strength, until you keep researching instead of starting. your system turns your habit into an experiment, so doing it is the research.'},
  O:{n:'obliger',c:'var(--O)',hex:'#f1d7fb',quote:'"i\'d never cancel on a friend. i cancel on myself all the time."',
     m:'the someone\'s waiting rule',steps:['gym → group classes','study → a friend to study with','money → someone who knows your goal'],
     why:'you never let other people down, but your own goals slip. it\'s not weakness, it\'s the most common type. you don\'t need more willpower, you need someone or something that expects you.'},
  R:{n:'rebel',c:'var(--R)',hex:'#c9f2f0',quote:'"the second it\'s a rule, i don\'t want to."',
     m:'the no-schedule rule',steps:['one number, no days: "3 workouts this week"','when, how, what: your call','nothing to rebel against'],
     why:'you do things because you want to, not because you should. schedules and streaks backfire on you. your system gives you a goal with total freedom inside it.'}
};
const MIX={
  UQ:{n:'the tested routine',why:'you love a clear routine, but only one you\'ve checked makes sense. so test first, then lock it in.',steps:['try 2 versions of the habit, one week each','keep the one that worked better','turn it into a fixed checklist and tick it off']},
  UO:{n:'the shared checklist',why:'you keep promises, and you keep them even better when someone else can see. so make your routine visible.',steps:['one fixed daily routine','share your checklist with one person','tick it off where she can see it']},
  UR:{n:'the free-zone rule',why:'part of you loves a plan, part of you hates being told what to do. so you write the rules, and leave room to break them.',steps:['3 non-negotiables you chose yourself','everything else is your free choice','one "off-plan" day every week, on purpose']},
  QO:{n:'the buddy experiment',why:'you need a reason and you need someone waiting for you. so test a method together.',steps:['pick one method with a friend','test it together for 2 weeks','compare results, keep what worked for you']},
  QR:{n:'the open lab',why:'you hate being told what to do and it has to make sense to you. so it\'s your experiment, with no schedule.',steps:['one weekly number: "3 times this week"','try a different way each time','keep only what you actually liked']},
  OR:{n:'the friend dare',why:'you show up for others but push back on rules. so don\'t make a plan, make a dare with someone.',steps:['challenge a friend, not a schedule: "7 days, bet?"','you choose how and when','you show up because she\'s in it too']}
};
const mixKey=(a,b)=>['UQ','UO','UR','QO','QR','OR'].find(k=>k.includes(a)&&k.includes(b));
const SOON={
  U:[['why one broken day','feels like total failure'],['your rulebook template','with built-in exits'],['a 30-day checklist routine','that bends without breaking'],['how to stop','over-planning everything'],['what to do when','the plan falls apart']],
  Q:[['why you research','instead of starting'],['the lab sheet','for testing any habit'],['a 30-day experiment plan','built on your own data'],['how to pick one method','and stop switching'],['3 questions to ask','before you change the plan']],
  O:[['why you keep','cancelling on yourself'],['ready-to-send texts','for an accountability partner'],['a 30-day plan where','someone is always waiting'],['the tracker for two','you and a friend'],['how to keep promises','without burning out for others']],
  R:[['why rules kill','every habit you start'],['the habit menu','for every mood'],['30 dares','instead of a schedule'],['how to say "i want"','instead of "i have to"'],['what to do','when you get bored of it']]
};
const CARDS=[
  ['O','when a friend made the plan, i show up. when i made the plan, i usually cancel.'],
  ['Q','i have saved posts, notes and videos about a habit i still haven\'t started.'],
  ['U','i don\'t need anyone to check on me. i check on myself.'],
  ['R','a streak makes me want to break it.'],
  ['O','work deadlines get done. my personal goals keep moving to "next month".'],
  ['U','when a plan changes last minute, it ruins my mood more than it should.'],
  ['Q','if a coach tells me to do something without explaining why, i quietly skip it.'],
  ['R','when someone reminds me to do something, i want to do it less.'],
  ['O','i\'d feel worse letting down my trainer than letting down myself.'],
  ['Q','i\'d rather follow my own version than the popular plan everyone uses.'],
  ['U','if i promise myself "no phone after 10", i actually stick to it.'],
  ['R','i do my best work when nobody is asking for it.']
];
let S={i:0,me:[]};
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2200); }
/* haptics: android vibrate, ios 18 switch trick */
function tick(strong){ try{ if(navigator.vibrate){ navigator.vibrate(strong?[14,40,14]:12); return; } }catch(e){} try{ $('#hapL').click(); if(strong) setTimeout(()=>$('#hapL').click(),90); }catch(e){} }

/* ---------- intro ---------- */
function intro(){
  app.innerHTML=`<div class="screen anim">
    <div class="fan"><i style="background:var(--U);transform:rotate(-12deg) translateX(-62px)"></i><i style="background:var(--Q);transform:rotate(-4deg) translateX(-20px)"></i><i style="background:var(--O);transform:rotate(4deg) translateX(22px)"></i><i style="background:var(--R);transform:rotate(12deg) translateX(64px)"></i></div>
    <h1>why do you <span class="red">quit?</span></h1>
    <p class="sub">12 cards. swipe up if it's you, down if it's not. find your habit type and the system that actually works for it.</p>
    <div class="how"><div><b>12</b>cards</div><div><b>1</b>minute</div><div><b>4</b>types</div></div>
    <button class="btn" id="go">start</button>
  </div>`;
  $('#go').onclick=()=>{ S={i:0,me:[]}; deck(); };
}

/* ---------- deck ---------- */
function deck(){
  app.innerHTML=`<div class="screen anim">
    <div class="dots">${CARDS.map((_,k)=>`<i class="${k<S.i?'d':''}"></i>`).join('')}</div>
    <div class="hintup">↑ that's me</div>
    <div class="deck" id="deck"></div>
    <div class="hintdown">↓ not me</div>
    <div class="ctrl"><button id="no">↓ not me</button><button class="me" id="yes">↑ that's me</button></div>
  </div>`;
  drawCards();
  $('#no').onclick=()=>fly(false); $('#yes').onclick=()=>fly(true);
}
function cardEl(k,cls){ const [t,q]=CARDS[k]; const d=document.createElement('div'); d.className='card '+cls;
  d.innerHTML=`<span class="n">${k+1} / 12</span><div class="tint" style="background:${T[t].c}"></div><div class="shade"></div><div class="lab me">that's me ✓</div><div class="q">${esc(q)}</div><div class="lab no">not me</div>`; return d; }
let topC=null, busy=false;
function drawCards(){
  const dk=$('#deck'); dk.innerHTML='';
  if(S.i+2<CARDS.length) dk.appendChild(cardEl(S.i+2,'back2'));
  if(S.i+1<CARDS.length) dk.appendChild(cardEl(S.i+1,'back'));
  if(S.i<CARDS.length){ topC=cardEl(S.i,'top'); dk.appendChild(topC); bindDrag(topC); }
  document.querySelectorAll('.dots i').forEach((d,k)=>d.classList.toggle('d',k<S.i));
}
function setPos(el,dy,anim){ const H=el.offsetHeight||400, p=Math.max(-1,Math.min(1,-dy/(H*.45)));
  el.style.transition=anim?'transform .32s cubic-bezier(.2,.8,.2,1)':'none';
  el.style.transform=`translate3d(0,${dy}px,0)`;
  const tint=el.querySelector('.tint'), me=el.querySelector('.lab.me'), no=el.querySelector('.lab.no');
  tint.style.opacity=Math.max(0,p)*.9; me.style.opacity=Math.max(0,p); no.style.opacity=Math.max(0,-p);
  el.querySelector('.shade').style.opacity=Math.max(0,-p)*.8; }
function bindDrag(el){
  let sy=0, dy=0, t0=0, raf=0, down=false;
  el.addEventListener('pointerdown',e=>{ if(busy) return; down=true; sy=e.clientY; dy=0; t0=performance.now(); try{ el.setPointerCapture(e.pointerId); }catch(_){} el.style.cursor='grabbing'; el.classList.add('dragging'); });
  el.addEventListener('pointermove',e=>{ if(!down) return; dy=e.clientY-sy; if(!raf) raf=requestAnimationFrame(()=>{ raf=0; setPos(el,dy,false); }); });
  const end=()=>{ if(!down) return; down=false; el.style.cursor=''; el.classList.remove('dragging'); const v=dy/Math.max(1,performance.now()-t0);
    if(dy<-90||v<-.6) fly(true); else if(dy>90||v>.6) fly(false); else setPos(el,0,true); };
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end);
}
function fly(me){
  if(busy||!topC) return; busy=true; const el=topC; const H=window.innerHeight;
  setPos(el,me?-H:H,true); el.style.opacity='0'; el.style.transition+=',opacity .32s';
  tick(false);
  if(me) S.me.push(CARDS[S.i][0]); S.i++;
  const b=document.querySelector('.card.back'), b2=document.querySelector('.card.back2');
  if(b){ b.style.transition='transform .3s ease'; b.style.transform='none'; } if(b2){ b2.style.transition='transform .3s ease,opacity .3s'; b2.style.transform='scale(.95) translateY(14px)'; b2.style.opacity='1'; }
  setTimeout(()=>{ busy=false; if(S.i>=CARDS.length) stacks(); else drawCards(); },300);
}
let wAcc=0, wT=0;
document.addEventListener('wheel',e=>{ const dk=document.getElementById('deck'); if(!dk||!topC) return; if(!dk.contains(e.target)&&Math.abs(e.deltaY)<1) return;
  e.preventDefault(); if(busy) return; wAcc+=e.deltaY; setPos(topC,-wAcc*.8,false); clearTimeout(wT);
  if(wAcc>140){ wAcc=0; fly(true); return; } if(wAcc<-140){ wAcc=0; fly(false); return; }
  wT=setTimeout(()=>{ wAcc=0; if(topC) setPos(topC,0,true); },160); },{passive:false});
document.addEventListener('keydown',e=>{ if(!$('#deck')) return; if(e.key==='ArrowUp'){ e.preventDefault(); fly(true); } if(e.key==='ArrowDown'){ e.preventDefault(); fly(false); } });

/* ---------- stacks + result ---------- */
function score(){ const c={U:0,Q:0,O:0,R:0}; S.me.forEach(t=>c[t]++); const order=Object.keys(c).sort((a,b)=>c[b]-c[a]); return {c,order}; }
function stacks(){
  const {c,order}=score();
  app.innerHTML=`<div class="screen anim">
    <h2>your <span class="red">cards.</span></h2>
    <p class="sub" style="margin-top:6px">each "that's me" landed on a pile.</p>
    <div class="stacks">${['U','Q','O','R'].map(t=>`<div class="stk">${Array.from({length:c[t]},()=>`<i style="background:${T[t].c}"></i>`).join('')}</div>`).join('')}</div>
    <div class="stl">${['U','Q','O','R'].map(t=>`<div><b>${c[t]}</b>${T[t].n}</div>`).join('')}</div>
  </div>`;
  const all=[...document.querySelectorAll('.stk i')]; all.forEach((x,k)=>setTimeout(()=>{ x.classList.add('in'); tick(false); },200+k*120));
  setTimeout(()=>{ tick(true); result(); },400+all.length*120+700);
}
function result(focus){
  const {c,order}=score(); const total=S.me.length;
  let main=focus||order[0]; const mix=!focus&&total&&c[order[1]]===c[order[0]]?order[1]:null;
  if(!total) main='O';
  const R=T[main], M=mix?T[mix]:null;
  app.innerHTML=`<div class="screen anim">
    <div class="res" style="background:${R.c}">
      <div class="tag">${total?(mix?'you\'re a mix':'your habit type'):'you swiped "not me" on everything. most people like that are'}</div>
      <h2>${R.n}${mix?`<span style="display:block;font-size:.55em;letter-spacing:-.03em;margin-top:4px">+ ${M.n}</span>`:''}</h2>
      <div class="quote">${esc(R.quote)}</div>
    </div>
    ${mix?(()=>{ const X=MIX[mixKey(main,mix)]; return `<div class="sys"><div class="mt">✦ your mix system</div><h3>${esc(X.n)}</h3><p class="why">${esc(X.why)}</p><ul>${X.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`; })()
      :`<div class="sys"><div class="mt">✦ your system</div><h3>${esc(R.m)}</h3><ul>${R.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ul><details><summary>why this works for you</summary><p class="why">${esc(R.why)}</p></details></div>`}
    <button class="btn" id="share" style="margin-top:36px">share my type</button>
    <p style="text-align:center;margin-top:14px"><button class="lnk" id="again">swipe again</button></p>
    <div class="soon"><span class="tag2">✦ coming soon ✦</span><span class="st tl">✦</span><span class="st tr">✦</span><span class="st bl">✦</span><span class="st br">✦</span>
      <h3>the ${esc(R.n)} system</h3>
      <p class="small" style="color:#555">a full 30-day kit made for how you work.</p>
      <ul>${SOON[main].map(([a,b])=>`<li>${esc(a)} <span class="blur">${esc(b)}</span></li>`).join('')}</ul>
      <p style="font-size:15px">leave your email and you'll get it first.</p>
      <div style="display:flex;gap:8px;align-items:flex-end;margin-top:6px"><input type="email" id="em" placeholder="your email"><button class="btn" id="send" style="width:auto;margin:0;padding:11px 16px;font-size:15px">join</button></div>
      <div id="mok"></div><p class="early">the early list gets a lower price.</p></div>
    <p class="links"><a href="https://gridyourgoal.com/energy" target="_blank" rel="noopener">now find <b>when</b> to do it: energy test →</a></p>
    <p class="links others">other types: ${['U','Q','O','R'].filter(t=>t!==main).map(t=>`<button data-t="${t}"><span style="background:${T[t].c}"></span>${T[t].n}</button>`).join('')}</p>
    <p class="credit">inspired by gretchen rubin's four tendencies. a quick self-check for planning habits, not a psychological assessment.</p>
  </div>`;
  window.scrollTo(0,0);
  $('#again').onclick=()=>{ S={i:0,me:[]}; deck(); };
  $('#share').onclick=()=>shareCard(main,mix);
  document.querySelectorAll('.links.others button').forEach(b=>b.onclick=()=>result(b.dataset.t));
  $('#send').onclick=async()=>{ const v=$('#em').value.trim(); if(!/^\S+@\S+\.\S+$/.test(v)){ toast('check your email'); return; }
    try{ await fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({'form-name':'type-list',email:v,type:T[main].n}).toString()}); }catch(e){}
    $('#mok').innerHTML='<p class="ok">done ✦ it\'s on its way soon.</p>'; $('#em').value=''; };
}

/* ---------- story card ---------- */
function wrapT(x,t,maxW){ const w=String(t).split(' '),o=[]; let l=''; w.forEach(s=>{ const tt=l?l+' '+s:s; if(x.measureText(tt).width>maxW&&l){o.push(l);l=s;} else l=tt; }); if(l) o.push(l); return o; }
async function shareCard(t,mix){
  try{ await document.fonts.load('500 120px Geist'); await document.fonts.load('400 40px Geist'); }catch(e){}
  const R=T[t]; const X=mix?MIX[mixKey(t,mix)]:null; const MN=X?X.n:R.m, MS=X?X.steps:R.steps; const c=document.createElement('canvas'); c.width=1080; c.height=1920; const x=c.getContext('2d');
  x.fillStyle='#fff'; x.fillRect(0,0,1080,1920);
  const lg=document.querySelector('.logo'); if(lg&&lg.complete){ const lh=110, lw=lg.naturalWidth*lh/lg.naturalHeight, k=Math.min(1,900/lw); x.drawImage(lg,90,100,lw*k,lh*k); }
  x.fillStyle='#111'; x.fillRect(90,240,900,6);
  x.font='400 50px Geist, sans-serif'; const ql=wrapT(x,R.quote,780); const qy=mix?780:740; const bh=qy+ql.length*64+40-330; x.fillStyle=R.hex; x.fillRect(90,330,900,bh);
  x.fillStyle='#555'; x.font='400 40px Geist, sans-serif'; x.textAlign='left'; x.fillText('my habit type',140,420);
  x.fillStyle='#111'; x.font='500 150px Geist, sans-serif'; x.fillText(R.n,130,580);
  if(mix){ x.font='500 56px Geist, sans-serif'; x.fillText('+ '+T[mix].n,140,660); }
  x.font='400 50px Geist, sans-serif'; wrapT(x,R.quote,780).forEach((l,k)=>x.fillText(l,140,(mix?780:740)+k*64));
  const sy=330+bh+120; x.fillStyle='#d23a2f'; x.font='400 36px Geist, sans-serif'; x.fillText(X?'✦ my mix system':'✦ my system',90,sy);
  x.fillStyle='#111'; x.font='500 76px Geist, sans-serif'; x.fillText(MN,90,sy+90);
  x.font='400 40px Geist, sans-serif'; MS.forEach((s,k)=>x.fillText('· '+s,90,sy+180+k*62));
  x.fillStyle='#111'; x.font='400 36px Geist, sans-serif'; x.fillText('find yours · '+SITE,90,1820);
  const blob=await new Promise(r=>c.toBlob(r,'image/png')); const url=URL.createObjectURL(blob); const file=new File([blob],'my-habit-type.png',{type:'image/png'});
  const can=!!(navigator.canShare&&navigator.canShare({files:[file]}));
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="msheet"><img src="${url}" alt="">${can?'<button class="btn" id="sh">share or save</button><p class="hint2">opens your phone\'s menu: instagram stories, save to photos and more</p>':''}<button class="btn ${can?'ghost':''}" id="dw">download</button><button class="x" id="cl">close</button></div>`;
  document.body.appendChild(m); m.onclick=e=>{ if(e.target===m) m.remove(); }; m.querySelector('#cl').onclick=()=>m.remove();
  m.querySelector('#dw').onclick=()=>{ const a=document.createElement('a'); a.href=url; a.download=file.name; document.body.appendChild(a); a.click(); a.remove(); };
  const sh=m.querySelector('#sh'); if(sh) sh.onclick=async()=>{ try{ await navigator.share({files:[file]}); }catch(e){} };
}
intro();
</script>
