const Q=[

 {id:'free',t:'one',q:'a free day, no alarm. when do you wake up?',a:[['before 8, my body just does that',{E:2}],['somewhere around 10',{M:2}],["after 12, don't judge",{L:2}]]},
 {id:'dead',t:'one',q:'a deadline in a week. what do you do?',a:[['do it all in one crazy night',{S:2}],['do a little every day',{D:2}],['start, stop, panic, then finish',{S:1}]]},
 {id:'focus',t:'one',q:'how long can you really focus?',a:[["an hour, maybe two, then i'm done",{S:2}],['hours, if nobody texts me',{D:2}],['honestly? 20 minutes',{S:1}]]},
 {id:'wake',t:'wake',q:'when do you actually wake up?',s:'not when you wish you did.'},

 {id:'best',t:'multi',max:2,q:()=>`your energy peaks around ${fmt(analyse().peak)}. what are you usually doing then?`,a:['the thing that matters most','classes or meetings','messages and emails','scrolling','chores and errands','commuting','still in bed','working out']},
 {id:'important',t:'one',q:'when do you usually do the thing that matters most that day?',a:[['first thing in the morning',{}],['late morning',{}],['in the afternoon',{}],['in the evening',{}],['whenever i finally get to it',{}]]},
 {id:'firsthour',t:'multi',max:3,q:'what does the first hour after you wake up look like?',a:['phone in bed','coffee straight away','daylight or a walk','a workout','a real breakfast','messages and emails','rushing out the door']},
 {id:'drain',t:'multi',max:3,q:'what drains you the most?',a:['bad sleep','scrolling','people and noise','too many decisions','food crashes','sitting all day','worrying','too much coffee']},
 {id:'lunch',t:'one',q:'what does lunch usually look like?',a:[['a proper meal',{}],['something quick at my desk',{}],['i skip it',{}],['snacks all day',{}]]},
 {id:'coffee',t:'one',q:'when is your last coffee or energy drink?',a:[['before noon',{}],['around 2 or 3pm',{}],['after 4pm',{}],["i don't drink caffeine",{}]]},
 {id:'s_tired',t:'me',q:'"i feel tired even after a full night\'s sleep"'},
 {id:'s_phone',t:'me',q:'"when i feel tired, i reach for my phone"'},
 {id:'s_food',t:'me',q:'"what i eat changes my energy a lot"'},
 {id:'s_rest',t:'me',q:'"i feel guilty when i rest"'},

 {id:'want',t:'multi',max:3,q:'what do you want more energy for?',a:['work or studies','training','my side project','friends and going out','being present with people i love','creative stuff','just feeling like myself again']}

const TYPES={ES:{name:'sunrise sprinter',line:'sharp at 7, done by 3.',about:"your brain is at its best before most people open their laptops. you work in short, intense bursts, and once they're used up, they're gone for the day."},
ED:{name:'early builder',line:'up early, steady till late afternoon.',about:"you start early and keep a calm, even pace for hours. you don't need adrenaline, you need a routine and a quiet morning."},
MS:{name:'midday sprinter',line:'slow start, unstoppable around noon.',about:"mornings are a warm-up for you. then around late morning you get a strong burst where you can do a day's work in two hours."},
MD:{name:'daylight builder',line:'even energy all day, gone by 10pm.',about:"your energy follows the sun: decent mornings, a long productive middle of the day, a soft landing in the evening."},
LS:{name:'night sprinter',line:'useless till noon, brilliant after 9pm.',about:"you come alive when everyone else is winding down. your best work happens in late, intense sessions."},
LD:{name:'slow burner',line:'warms up all day, peaks late.',about:"you need time to get going, but once you're in, you can focus for hours. your energy builds through the afternoon."}};

const LET='abcdefgh';const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

 app.innerHTML=`<div class="stage"><div class="q load"><svg viewBox="0 0 300 80" class="lw"><path d="M5 60 C40 60 50 15 85 18 S130 55 160 50 S205 20 230 28 S270 70 295 66"/></svg><h2 id="lm">${MSG[0]}</h2><p class="sub">your report opens here in a few seconds. keep this page open.</p></div></div>`;
 return setInterval(()=>{k=(k+1)%MSG.length;const m=document.getElementById('lm');if(m)m.textContent=MSG[k]},2600);}
async function fetchReport(id){const t=loading();let tries=0;
 try{const c=localStorage.getItem('rep:'+id);if(c){clearInterval(t);return showReport(JSON.parse(c))}}catch(e){}
 while(tries++<40){
  try{const r=await fetch(API+'/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({checkout_id:id,answers:answersText()})});
   if(r.status===200){const rep=await r.json();clearInterval(t);try{localStorage.setItem('rep:'+id,JSON.stringify(rep))}catch(e){}return showReport(rep)}
   if(r.status!==202)break;}catch(e){}
  await new Promise(z=>setTimeout(z,3000));}
 clearInterval(t);app.innerHTML=`<div class="stage"><div class="q"><h2>your report is taking longer than usual</h2><p class="sub">your payment went through and your report is safe. refresh this page in a minute, or write to wellnessforquitters@gmail.com and we'll send it to you.</p><div class="go"><button class="ok" onclick="location.reload()">refresh</button></div></div></div>`;}
function showReport(rep){const R=analyse();document.getElementById('nav').style.display='none';document.querySelector('#bar i').style.width='100%';

 app.innerHTML=`<div class="res rep2">
 <div class="cd hero"><p class="kick">your full energy report</p><div class="tname">${esc(R.T.name)}</div><p class="ident">${esc(rep.identity)}</p></div>
 <div class="cd">${bestCard(bestHours(R))}<div class="txt" style="margin-top:20px">${par(rep.best)}</div></div>
 <div class="nums">${nums(R).map(n=>`<div class="cd nm"><b>${n[0]}</b><p>${n[1]}</p><small>${n[2]}</small></div>`).join('')}</div>
 <div class="cd"><p class="kick">the overall read</p><div class="txt lg">${par(rep.read)}</div></div>
 ${A.curve?`<div class="cd"><p class="kick">your energy map</p><canvas id="map"></canvas><div class="ends">${[[6,"6am"],[12,"noon"],[18,"6pm"],[24,"12am"],[26,"2am"]].map(([h,l])=>`<span style="left:calc(8px + (100% - 16px)*${(h-6)/20})">${l}</span>`).join("")}</div><div class="legend"><span class="g">golden hours</span><span class="d">the dip</span>${R.swDrawn?'<span class="b">late energy boost</span>':''}</div></div>`:''}
 ${(rep.areas||[]).map(a=>`<div class="cd area"><p class="kick">${esc(a.name)}</p><h4>${esc(a.title)}</h4><div class="txt">${par(a.text)}</div><div class="needs"><small>what it needs</small><p>${esc(a.needs)}</p></div></div>`).join('')}
 <div class="cd"><p class="kick">your best time for</p><div class="day">${(rep.timing||[]).map(d=>`<div class="dr"><b>${esc(d.time)}</b><div><small>${esc(d.for)}</small><p>${esc(d.why)}</p></div></div>`).join('')}</div></div>
 <div class="cd pink"><p class="kick">this week, you'll probably</p><ul class="pred">${(rep.predictions||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
 <div class="cd"><p class="kick">what's really draining you</p><div class="txt">${par(rep.drains)}</div></div>
 <div class="cd pink"><p class="kick">your biggest blind spot</p><div class="txt lg">${par(rep.blindspot)}</div></div>
 <div class="cd"><p class="kick">your ideal day, hour by hour</p><div class="day">${(rep.day||[]).map(d=>`<div class="dr"><b>${esc(d.time)}</b><div><small>${esc(d.title)}</small><p>${esc(d.text)}</p></div></div>`).join('')}</div></div>
 <div class="cd"><p class="kick">3 changes that matter most</p><div class="chg">${(rep.changes||[]).map((c,i)=>`<div><span>${i+1}</span><div><h5>${esc(c.title)}</h5><p>${esc(c.text)}</p></div></div>`).join('')}</div></div>
 <div class="cd"><p class="kick">what doesn't work for you</p><ul class="dont">${(rep.dont||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
 <p class="closing">${esc(rep.closing)}</p>
 <div class="after"><button onclick="window.print()">save as pdf</button><button id="again">take the test again</button></div></div>`;
 if(A.curve)drawMap(R);document.getElementById('again').onclick=()=>{history.replaceState(null,'',location.pathname);step=-1;render()};window.scrollTo(0,0);}

/* ---------- friend, story card ---------- */
const SITE='gridyourgoal.com/energy';
const PRM=new URLSearchParams(location.search);
const enc=c=>c.map(v=>Math.round(v*9)).join(''),dec=t=>(!t||t.length!==21)?null:t.split('').map(d=>(+d)/9);
const friend=PRM.get('t')&&TYPES[PRM.get('t')]?{t:PRM.get('t'),n:(PRM.get('n')||'your friend').slice(0,18),c:dec(PRM.get('c'))}:null;
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2400)}
function compareCard(R){if(!friend)return'';const fn=esc(friend.n),ft=TYPES[friend.t].name;
 if(!friend.c||!A.curve)return `<div class="cd"><p class="kick">you and ${fn}</p><p class="tab">${fn} is a ${ft}. you're a ${R.T.name}.</p></div>`;
 let bi=0,bv=-1;for(let i=0;i<21;i++){const v=Math.min(A.curve[i],friend.c[i]);if(v>bv){bv=v;bi=i}}
 return `<div class="cd"><p class="kick">you and ${fn}</p><p class="tab">${fn} is a ${ft}. your best time together is around <b style="color:var(--red);font-weight:500">${fmt(6+bi)}</b>, when you both still have energy. plan the important talks, the gym or the big tasks for then.</p></div>`}
function shareFriend(){const R=analyse();const url=location.origin+location.pathname+'?t='+R.key+'&n='+encodeURIComponent(A.name||'')+(A.curve?'&c='+enc(A.curve):'');
 const text="i'm a "+R.T.name+". what's your energy type?";
 if(navigator.share)navigator.share({title:"what's your energy type?",text,url}).catch(()=>{});
 else if(navigator.clipboard)navigator.clipboard.writeText(text+' '+url).then(()=>toast('link copied, send it to someone'));
 else prompt('copy this link',url);}
function plotCard(x,W,H,data,R){const pad=8,X=h=>pad+(W-2*pad)*(h-6)/20,xi=i=>pad+(W-2*pad)*i/20,y=v=>H-pad-(H-2*pad)*v;
 x.fillStyle='rgba(210,58,47,.12)';x.fillRect(X(R.g0),0,X(R.g1)-X(R.g0),H);
 x.strokeStyle='#111';x.lineWidth=7;x.lineJoin='round';x.beginPath();x.moveTo(xi(0),y(data[0]));for(let i=1;i<data.length;i++){const xc=(xi(i-1)+xi(i))/2;x.quadraticCurveTo(xi(i-1),y(data[i-1]),xc,(y(data[i-1])+y(data[i]))/2)}x.lineTo(xi(20),y(data[20]));x.stroke();
 let i=R.dip-6;x.fillStyle='#fff';x.lineWidth=3;x.setLineDash([8,8]);x.beginPath();x.arc(xi(i),y(data[i]),17,0,7);x.fill();x.stroke();x.setLineDash([]);
 if(R.swDrawn){i=R.sw-6;x.fillStyle='#111';x.beginPath();x.arc(xi(i),y(data[i]),14,0,7);x.fill()}}
let CARD=null;
async function buildCard(){const R=analyse();try{await document.fonts.load('500 120px Geist');await document.fonts.load('400 40px Geist')}catch(e){}
 const c=document.createElement('canvas');c.width=1080;c.height=1920;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,1080,1920);
 const lg=document.getElementById('logo');if(lg&&lg.complete&&lg.naturalWidth){const lh=120,lw=lg.naturalWidth*lh/lg.naturalHeight,k=Math.min(1,900/lw);x.drawImage(lg,90,95,lw*k,lh*k)}
 x.fillStyle='#111';x.fillRect(90,240,900,6);x.textAlign='left';x.font='400 40px Geist';x.fillStyle='#8c8c8c';x.fillText((A.name?A.name+"'s":'my')+' energy type',90,380);
 x.fillStyle='#111';x.font='500 132px Geist';const w=R.T.name.split(' ');x.fillText(w[0],80,540);x.fillText(w.slice(1).join(' '),80,680);
 x.font='400 44px Geist';x.fillText(R.T.line,90,780);
 if(A.curve){x.save();x.translate(90,880);plotCard(x,900,520,A.curve,R);x.restore()}
 x.strokeStyle='#111';x.lineWidth=3;x.beginPath();x.moveTo(90,1400);x.lineTo(990,1400);x.stroke();
 x.fillStyle='#8c8c8c';x.font='400 30px Geist';const lx=h=>90+8+(900-16)*(h-6)/20;x.fillText('6am',90,1450);x.textAlign='center';x.fillText('noon',lx(12),1450);x.fillText('6pm',lx(18),1450);x.fillText('12am',lx(24),1450);
 x.textAlign='left';x.font='400 38px Geist';x.fillText('golden hours',90,1580);x.fillStyle='#d23a2f';x.font='500 84px Geist';x.fillText(fmt(R.g0)+'–'+fmt(R.g1),90,1680);
 x.fillStyle='#111';x.font='400 36px Geist';x.fillText('find yours · '+SITE,90,1830);
 const blob=await new Promise(r=>c.toBlob(r,'image/png'));CARD={file:new File([blob],'my-energy-type.png',{type:'image/png'}),url:URL.createObjectURL(blob),name:R.T.name};}
async function openCard(){if(!CARD){toast('one second');await buildCard()}
 const canShare=!!(navigator.canShare&&navigator.canShare({files:[CARD.file]}));const m=document.createElement('div');m.className='modal';
 m.innerHTML=`<div class="sheet"><img src="${CARD.url}" alt="your energy type card">${canShare?`<button class="btn2" id="shareCard">share or save</button><p class="hint2">opens your phone's menu: instagram stories, save to photos, messages and more</p>`:''}<button class="btn2 ${canShare?'ghost':''}" id="dlCard">download</button>${!canShare?'<p class="hint2">on a phone you can also press and hold the image to save it</p>':''}<button class="x" id="closeCard">close</button></div>`;
 document.body.appendChild(m);m.addEventListener('click',e=>{if(e.target===m)m.remove()});m.querySelector('#closeCard').onclick=()=>m.remove();
 m.querySelector('#dlCard').onclick=()=>{const a=document.createElement('a');a.href=CARD.url;a.download='my-energy-type.png';document.body.appendChild(a);a.click();a.remove()};
 const sb=m.querySelector('#shareCard');if(sb)sb.onclick=()=>navigator.share({files:[CARD.file],title:'my energy type',text:"i'm a "+CARD.name+'. find yours: '+SITE}).catch(()=>{});}
const CID=new URLSearchParams(location.search).get('checkout_id');var CID_ON=!!CID;
if(CID){try{Object.assign(A,JSON.parse(localStorage.getItem('energyA')||'{}'))}catch(e){}step=Q.length;fetchReport(CID)}else render();
</script></body></html>
